<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: app shell. Fixed left rail (nav + jurisdiction), top context bar, one working view at a time. Rail collapses to a scrolling tab strip on phones. */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --sunk:#EAF0F2; --ink:#14212B; --muted:#56687A; --line:#D7E0E5;
  --accent:#1E5B6B; --accent-ink:#FFFFFF; --accent-soft:#E1EDF0; --brass:#8A6A1F; --brass-soft:#F5EEDC;
  --high:#B42318; --high-soft:#FDECEA; --med:#A64B05; --med-soft:#FEF2E2; --low:#25704A; --low-soft:#E5F4EB;
  --f-display:"IBM Plex Serif", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D151B; --surface:#141F27; --sunk:#0F1A21; --ink:#E4EBEF; --muted:#94A6B3; --line:#24343F;
  --accent:#74B6C6; --accent-ink:#0B1A20; --accent-soft:#183641; --brass:#D4B46A; --brass-soft:#2F2918;
  --high:#F7837A; --high-soft:#3A1C1B; --med:#F2AE57; --med-soft:#36270F; --low:#6CCB96; --low-soft:#16301F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D151B; --surface:#141F27; --sunk:#0F1A21; --ink:#E4EBEF; --muted:#94A6B3; --line:#24343F;
  --accent:#74B6C6; --accent-ink:#0B1A20; --accent-soft:#183641; --brass:#D4B46A; --brass-soft:#2F2918;
  --high:#F7837A; --high-soft:#3A1C1B; --med:#F2AE57; --med-soft:#36270F; --low:#6CCB96; --low-soft:#16301F;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.25rem;letter-spacing:.01em}
.brand small{display:block;font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:.93rem;white-space:nowrap}
nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
nav a:hover{background:var(--sunk)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.rail-foot{margin-top:auto;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding:14px 6px 0;display:flex;flex-direction:column;gap:6px}
.lock{display:flex;gap:8px;align-items:flex-start}
.lock svg{flex:none;margin-top:2px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.ctl{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.ctl select{min-width:0;max-width:100%;flex:1 1 auto}
.ctl label{font-size:.78rem;color:var(--muted);font-weight:600}
select,.input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
select{padding-right:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;cursor:pointer;font-size:.9rem}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:.82rem}
.notice{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.8rem;background:var(--brass-soft);color:var(--brass);border-radius:999px;padding:5px 12px;font-weight:500}
.view{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1180px;width:100%}
.view-head{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between}
.view-head p{color:var(--muted);max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-high{background:var(--high-soft);color:var(--high)} .p-med{background:var(--med-soft);color:var(--med)} .p-low{background:var(--low-soft);color:var(--low)}
.p-info{background:var(--accent-soft);color:var(--accent)} .p-brass{background:var(--brass-soft);color:var(--brass)}
.tag{display:inline-block;font-size:.72rem;border:1px dashed var(--line);color:var(--muted);border-radius:6px;padding:1px 7px}

/* Assistant */
.chat{display:flex;flex-direction:column;gap:16px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem;cursor:pointer}
.cat:hover,.cat[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.msg-user{align-self:flex-end;max-width:80%;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:14px 14px 4px 14px}
.answer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.answer-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--sunk)}
.answer-head .who{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.88rem}
.riskrow{display:flex;flex-wrap:wrap;gap:6px}
.sec{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:170px minmax(0,1fr);gap:6px 18px}
.sec:last-child{border-bottom:0}
.sec h3{font-family:var(--f-body);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:2px}
.sec ul,.sec ol{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.law{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px dashed var(--line)}
.law:first-child{border-top:0;padding-top:0}
.law .cite{font-family:var(--f-mono);font-size:.84rem;font-weight:500}
.law .row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.law .note{font-size:.82rem;color:var(--med)}
.lawyer-box{display:flex;gap:12px;align-items:flex-start}
.answer-foot{padding:12px 18px;font-size:.8rem;color:var(--muted);background:var(--sunk);border-top:1px solid var(--line)}
.composer{position:sticky;bottom:0;display:flex;gap:8px;background:var(--bg);padding-block:10px}
.composer textarea{flex:1;min-width:0;resize:none;height:48px;border-radius:10px;padding:12px}
.typing{display:flex;gap:4px;padding:14px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing span{animation:none}}
.side-list{display:flex;flex-direction:column;gap:10px}
.side-list .item{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:.88rem}

/* Dashboard */
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto}
.matrix{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:4px;font-size:.76rem}
.matrix .cell{aspect-ratio:1.6;border-radius:6px;background:var(--sunk);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px;padding:4px}
.matrix .lbl{color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:700;color:#fff}
.deadline{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.deadline:first-child{border-top:0;padding-top:0}
.date{flex:none;width:52px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;font-variant-numeric:tabular-nums}
.date b{display:block;font-family:var(--f-display);font-size:1.2rem;line-height:1.1}
.date small{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* Review */
.flag{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.flag.high{border-left-color:var(--high)} .flag.med{border-left-color:var(--med)} .flag.low{border-left-color:var(--low)}
.flag q{font-style:italic;color:var(--muted);font-size:.86rem}
textarea.doc{width:100%;min-height:300px;font-family:var(--f-mono);font-size:.82rem;line-height:1.6;resize:vertical}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;display:flex}
.meter span{display:block;height:100%}

/* Generator */
.form{display:grid;gap:12px}
.form .field{display:flex;flex-direction:column;gap:4px}
.form label{font-size:.8rem;font-weight:600;color:var(--muted)}
.form .input,.form textarea{width:100%}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:32px 36px;font-family:var(--f-display);font-weight:500;font-size:.95rem;line-height:1.7;white-space:pre-wrap;box-shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(20,33,43,.35);min-width:0;overflow-wrap:anywhere}
.paper mark{background:var(--brass-soft);color:var(--brass);border-radius:3px;padding:0 3px}

/* Lawyers */
.lawyer{display:flex;flex-direction:column;gap:10px}
.lawyer .top{display:flex;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;background:var(--accent-soft);color:var(--accent);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.75rem;background:var(--sunk);border-radius:6px;padding:2px 8px}
.verified{color:var(--low);font-size:.78rem;font-weight:600;display:flex;gap:4px;align-items:center}

/* Updates */
.update{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 18px;padding:14px 0;border-top:1px solid var(--line)}
.update:first-child{border-top:0}
.update .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}

/* Privacy */
.toggle{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.switch{width:40px;height:22px;border-radius:99px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:21px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:column;gap:10px;padding-block:12px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line)}
  nav{overflow-x:auto;margin-inline:-4px}
  nav ul{flex-direction:row}
  .rail-foot{display:none}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .notice{margin-left:0}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .sec{grid-template-columns:minmax(0,1fr)}
  .update{grid-template-columns:minmax(0,1fr)}
  .paper{padding:20px}
  .msg-user{max-width:92%}
}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="var(--accent)"/><path d="M17 8v18M11 26h12M9 13h16M12 13l-3 7h6zM22 13l-3 7h6z" stroke="var(--accent-ink)" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
      <div><b>LEX</b><small>Legal information</small></div>
    </div>
    <nav aria-label="Main"><ul id="nav"></ul></nav>
    <div class="rail-foot">
      <div class="lock"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span data-i18n="secure">End-to-end encrypted. Your matters are private to you.</span></div>
      <span>Demo build · sample data only</span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="ctl">
        <label for="jur" data-i18n="jurisdiction">Jurisdiction</label>
        <select id="jur"></select>
        <button class="btn sm" id="detect" type="button" title="Suggest a jurisdiction from your device's time zone">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/></svg><span data-i18n="detect">Detect</span></button>
      </div>
      <div class="ctl">
        <label for="lang" data-i18n="language">Language</label>
        <select id="lang"><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option></select>
      </div>
      <div class="notice" role="note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg><span data-i18n="notice">AI-generated legal information, not legal advice</span></div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- i18n (UI chrome only in this demo) ---------- */
const I18N = {
  en:{jurisdiction:"Jurisdiction",detect:"Detect",language:"Language",notice:"AI-generated legal information, not legal advice",secure:"End-to-end encrypted. Your matters are private to you.",
      assistant:"Assistant",dashboard:"Dashboard",review:"Document review",generate:"Document builder",lawyers:"Find a lawyer",updates:"Legal updates",privacy:"Privacy & security",
      ask:"Describe your situation in your own words…",send:"Ask",
      s_summary:"Your situation",s_jur:"Jurisdiction",s_laws:"Relevant law",s_rights:"Rights & obligations",s_options:"Your options",s_risks:"Risks & consequences",s_steps:"Next steps",s_refs:"Sources",s_lawyer:"Do you need a lawyer?"},
  fr:{jurisdiction:"Juridiction",detect:"Détecter",language:"Langue",notice:"Information juridique générée par IA, pas un avis juridique",secure:"Chiffrement de bout en bout. Vos dossiers restent privés.",
      assistant:"Assistant",dashboard:"Tableau de bord",review:"Analyse de documents",generate:"Générateur de documents",lawyers:"Trouver un avocat",updates:"Actualités juridiques",privacy:"Confidentialité",
      ask:"Décrivez votre situation avec vos propres mots…",send:"Envoyer",
      s_summary:"Votre situation",s_jur:"Juridiction",s_laws:"Textes applicables",s_rights:"Droits et obligations",s_options:"Vos options",s_risks:"Risques et conséquences",s_steps:"Prochaines étapes",s_refs:"Sources",s_lawyer:"Faut-il un avocat ?"},
  es:{jurisdiction:"Jurisdicción",detect:"Detectar",language:"Idioma",notice:"Información jurídica generada por IA, no asesoramiento legal",secure:"Cifrado de extremo a extremo. Sus asuntos son privados.",
      assistant:"Asistente",dashboard:"Panel",review:"Revisión de documentos",generate:"Generador de documentos",lawyers:"Buscar abogado",updates:"Novedades legales",privacy:"Privacidad y seguridad",
      ask:"Describa su situación con sus propias palabras…",send:"Preguntar",
      s_summary:"Su situación",s_jur:"Jurisdicción",s_laws:"Normas aplicables",s_rights:"Derechos y obligaciones",s_options:"Sus opciones",s_risks:"Riesgos y consecuencias",s_steps:"Próximos pasos",s_refs:"Fuentes",s_lawyer:"¿Necesita abogado?"}
};
let lang = 'en';
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;

/* ---------- Jurisdictions ---------- */
const JUR = {
  ew:{name:"England & Wales, United Kingdom", short:"England & Wales", tz:["Europe/London"]},
  ca:{name:"California, United States", short:"California", tz:["America/Los_Angeles"]},
  gh:{name:"Ghana", short:"Ghana", tz:["Africa/Accra"]}
};
const SOON = ["Nigeria","Kenya","Sierra Leone","South Africa","Ontario, Canada","New South Wales, Australia"];
let jur = 'ew';

const CATS = [
  ["employment","Employment","I was dismissed from my job without any warning. Can I challenge it?"],
  ["property","Property & tenancy","My landlord won't return my deposit after I moved out."],
  ["consumer","Consumer protection","The laptop I bought two weeks ago stopped working and the shop refuses a refund."],
  ["family","Family","My partner and I are separating. What happens with the children?"],
  ["criminal","Criminal","I've been asked to attend a police interview. What are my rights?"],
  ["contract","Contract","A client hasn't paid my invoice for three months."],
  ["corporate","Corporate","What do I need to register a small company?"],
  ["tax","Taxation","I received a tax penalty notice I think is wrong."],
  ["immigration","Immigration","My work visa expires next month. What are my options?"],
  ["rights","Human rights","I think I was refused a service because of my religion."]
];

/* ---------- Worked answers (real, well-known provisions; currency flagged) ---------- */
const LEG = 'https://www.legislation.gov.uk/ukpga/';
const CAL = (code, s) => `https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=${code}&sectionNum=${s}`;
const A = {
 ew:{
  employment:{
   summary:"You were dismissed by your employer without a warning or a fair procedure, and you want to know whether you can challenge the dismissal.",
   laws:[

  const s=text.toLowerCase();
  if(/dismiss|fired|sacked|terminat|let go|my job|employer|redundan/.test(s))return'employment';
  if(/deposit|landlord|rent|tenan|evict|lease/.test(s))return'property';
  if(/refund|faulty|broken|stopped working|shop|seller|product|bought/.test(s))return'consumer';
  for(const [k,l] of CATS){if(s.includes(l.split(' ')[0].toLowerCase()))return k}
  return state.cat||'employment';
}

 [/indemnif/i,"med","Broad indemnity","An unlimited indemnity may be unfair under the Consumer Rights Act 2015, Part 2, and might not bind you."],
 [/arbitration/i,"med","Arbitration chosen by one party","One-sided dispute clauses in consumer contracts may be unfair. You may still use the deposit scheme and courts."],
 [/governed by the law/i,"low","Governing law","Standard clause. It confirms which jurisdiction's law applies."]
];
V.review = () => `
 <div class="view-head"><div><span class="eyebrow">Document analysis</span><h1>Review a document</h1><p>Upload or paste a contract, notice or agreement. LEX flags clauses that may be unfair, unlawful or risky under ${esc(JUR[jur].short)} law.</p></div></div>
 <div class="split">
  <div class="panel grid">
   <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between"><span class="eyebrow">Sample tenancy agreement loaded</span>
    <label class="btn sm" for="file">Upload .txt<input id="file" type="file" accept=".txt,text/plain" hidden></label></div>
   <label for="doc" hidden>Document text</label><textarea id="doc" class="doc">${esc(SAMPLE_DOC)}</textarea>
   <div><button class="btn primary" id="analyse" type="button">Analyse document</button></div>
  </div>
  <div class="panel grid" id="findings"></div>
 </div>`;
function analyse(){
  const text=$('#doc').value; const lines=text.split(/\n+/).filter(l=>l.trim());
  const hits=[];
  for(const [re,lvl,title,why] of RULES){const line=lines.find(l=>re.test(l)); if(line)hits.push({lvl,title,why,line:line.trim()})}
  const n={high:0,med:0,low:0}; hits.forEach(h=>n[h.lvl]++);
  const tot=Math.max(1,hits.length);
  $('#findings').innerHTML = `<div><span class="eyebrow">Findings</span><h2>${hits.length} clause${hits.length===1?'':'s'} flagged</h2></div>
   <div class="meter" aria-hidden="true"><span style="width:${n.high/tot*100}%;background:var(--high)"></span><span style="width:${n.med/tot*100}%;background:var(--med)"></span><span style="width:${n.low/tot*100}%;background:var(--low)"></span></div>
   <div class="riskrow"><span class="pill p-high">${n.high} high</span><span class="pill p-med">${n.med} medium</span><span class="pill p-low">${n.low} low</span></div>
   ${hits.map(h=>`<div class="flag ${h.lvl}"><b>${h.title}</b><q>${esc(h.line.slice(0,140))}</q><span style="font-size:.88rem">${esc(h.why)}</span></div>`).join('') || '<p class="muted">No risky clauses matched. In the full product, every clause is read in context, not just matched to patterns.</p>'}
   <p class="muted" style="font-size:.8rem">Review based on England & Wales tenancy law. AI-generated information, not legal advice.</p>`;
}

function render(){
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  renderNav();
  $('#view').innerHTML = V[state.view]();
  if(state.view==='review')analyse();
  if(state.view==='generate')renderPaper();
  if(state.view==='updates')renderUpdates();
}
function route(){const h=location.hash.slice(1);state.view=VIEWS.includes(h)?h:'assistant';render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

$('#jur').innerHTML = Object.entries(JUR).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')+`<optgroup label="Coming soon">${SOON.map(s=>`<option disabled>${s}</option>`).join('')}</optgroup>`;

$('#lang').addEventListener('change',e=>{lang=e.target.value;render();if(lang!=='en')toast('Interface translated. In the product, answers are translated too.')});
$('#detect').addEventListener('click',()=>{
  let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){}
  const hit=Object.entries(JUR).find(([k,v])=>v.tz.includes(tz));
  if(hit){jur=hit[0];$('#jur').value=jur;render();toast('Detected '+JUR[jur].name+' from your time zone')}
  else toast(`Your time zone (${tz||'unknown'}) isn't covered yet. Choose a jurisdiction from the list.`);
});

document.addEventListener('click',e=>{
  const c=e.target.closest('[data-cat]');
  if(c){state.cat=c.dataset.cat;const q=$('#q');q.value=CATS.find(x=>x[0]===state.cat)[2];q.focus();document.querySelectorAll('.cat').forEach(b=>b.setAttribute('aria-pressed',b===c));return}
  const s=e.target.closest('.switch');
  if(s){s.setAttribute('aria-checked',s.getAttribute('aria-checked')!=='true');return}
  const b=e.target.closest('[data-book]');
  if(b){b.textContent='Request sent (demo)';b.disabled=true;toast('Demo only: no request was sent to '+b.dataset.book);return}
  const tt=e.target.closest('[data-toast]'); if(tt){toast(tt.dataset.toast);return}
  if(e.target.id==='delbtn'){$('#delconfirm').hidden=false;return}
  if(e.target.id==='analyse'){analyse();toast('Analysis complete');return}
  if(e.target.id==='save'){toast('Saved to your dashboard (demo)');return}
  if(e.target.id==='copy'){const txt=$('#paper').textContent;
    navigator.clipboard.writeText(txt).then(()=>toast('Copied to clipboard')).catch(()=>{const r=document.createRange();r.selectNodeContents($('#paper'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('Text selected. Press Ctrl+C or ⌘C to copy.')});return}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='composer')return; e.preventDefault();
  const q=$('#q').value.trim(); if(!q)return;
  const cat=classify(q); state.cat=cat;
  state.chat.push({role:'user',text:q});
  const th=$('#thread');
  th.insertAdjacentHTML('beforeend',`<div class="msg-user">${esc(q)}</div><div class="answer" id="typing"><div class="typing" aria-label="LEX is checking sources"><span></span><span></span><span></span></div></div>`);
  $('#q').value='';
  $('#typing').scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(()=>{const m={role:'ai',jur,cat};state.chat.push(m);$('#typing').outerHTML=answerHTML(m);},1100);
});
document.addEventListener('keydown',e=>{if(e.target.id==='q'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#composer').requestSubmit()}});
document.addEventListener('input',e=>{if(e.target.closest('#genform')&&e.target.id!=='tpl')renderPaper()});
document.addEventListener('change',e=>{
  if(e.target.id==='tpl'){state.gen.tpl=e.target.value;render()}
  if(e.target.id==='upf')renderUpdates();
  if(e.target.id==='file'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{$('#doc').value=r.result;analyse();toast('Document loaded and analysed')};r.readAsText(e.target.files[0])}
});

state.chat.push({role:'ai',jur:'ew',cat:'employment'});
route();
</script>
